name: prisma_ia
description: "Tutor inteligente con IA para estudiantes de secundaria en Nicaragua"
publish_to: 'none'
version: 1.1.1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.0
  flutter_markdown: ^0.7.3+1
  gpt_markdown: ^1.3.0
  http: ^1.6.0
  pdfrx: ^2.6.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
# Configuración del generador de iconos
flutter_launcher_icons:
  android: true
  image_path: "assets/images/icono_app.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/pdf/